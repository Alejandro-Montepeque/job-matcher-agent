services:
  db:
    image: postgres:16-alpine
    container_name: jobmatcher-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobmatcher
    volumes:
      - jobmatcher_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobmatcher"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: jobmatcher-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    env_file:
      - ./backend/.env
    environment:
      # Override DATABASE_URL so the backend talks to the `db` service inside the
      # docker network, regardless of what backend/.env has for local non-Docker dev.
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/jobmatcher
      - ALLOWED_ORIGINS=http://localhost:5173
      - ENV=development
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: jobmatcher-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  jobmatcher_pgdata:
